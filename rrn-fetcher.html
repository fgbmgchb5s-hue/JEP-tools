<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRN Fetcher – JEP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5efe8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }



    .subtitle {
      font-size: 13px;
      color: #5a7a5a;
      margin-top: 2px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(26,107,26,0.10);
      padding: 28px 28px 24px;
      width: 100%;
      max-width: 480px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2d4a2d;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px 16px;
      border: 1.5px solid #c8dcc8;
      border-radius: 9px;
      font-size: 16px;
      font-family: inherit;
      color: #1a2e1a;
      background: #f9fdf9;
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"]:focus {
      border-color: #1a6b1a;
      background: #fff;
    }

    input[type="text"]::placeholder {
      text-transform: none;
      letter-spacing: 0;
      color: #aabcaa;
    }

    button.search-btn {
      padding: 13px 20px;
      background: #1a6b1a;
      color: #f5efe8;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button.search-btn:hover { background: #155515; }
    button.search-btn:active { transform: scale(0.97); }
    button.search-btn:disabled { background: #9ab89a; cursor: not-allowed; transform: none; }

    /* Address picker */
    .address-list {
      margin-top: 20px;
    }

    .address-list-label {
      font-size: 13px;
      font-weight: 600;
      color: #2d4a2d;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }

    .address-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #1a2e1a;
      border: 1.5px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 6px;
    }

    .address-item:nth-child(odd) { background: #eef5ee; }
    .address-item:nth-child(even) { background: #f9fdf9; }

    .address-item:hover {
      border-color: #1a6b1a;
      background: #e0ede0;
    }

    .address-item .addr-text { flex: 1; }
    .address-item .addr-date {
      font-size: 12px;
      color: #5a7a5a;
      margin-left: 10px;
      white-space: nowrap;
    }

    /* RRN Result */
    .result-block {
      margin-top: 24px;
      text-align: center;
    }

    .result-address {
      font-size: 13px;
      color: #5a7a5a;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .rrn-display {
      font-size: 20px;
      font-weight: 700;
      color: #1a2e1a;
      letter-spacing: 1.5px;
      background: #eef5ee;
      border: 1.5px solid #c8dcc8;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      word-break: break-all;
    }

    /* Copy button — two squares diagonally offset */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      background: #1a6b1a;
      color: #f5efe8;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .copy-btn:hover { background: #155515; }
    .copy-btn:active { transform: scale(0.97); }

    /* Two-square diagonal icon */
    .copy-icon {
      position: relative;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .copy-icon .sq {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .copy-icon .sq-back {
      background: rgba(245,239,232,0.45);
      border: 1.5px solid rgba(245,239,232,0.7);
      top: 5px;
      left: 5px;
    }

    .copy-icon .sq-front {
      background: #f5efe8;
      border: 1.5px solid rgba(245,239,232,0.9);
      top: 0;
      left: 0;
    }

    .copy-btn.copied {
      background: #2e8b2e;
    }

    .copied-msg {
      font-size: 12px;
      color: #2e8b2e;
      margin-top: 10px;
      height: 16px;
      transition: opacity 0.3s;
    }

    /* Status / error */
    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #5a7a5a;
      text-align: center;
      min-height: 20px;
    }

    .error { color: #b94040; }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #c8dcc8;
      border-top-color: #1a6b1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      height: 1px;
      background: #e0eae0;
      margin: 20px 0;
    }

    .reset-btn {
      background: none;
      border: none;
      color: #5a7a5a;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 14px;
      text-decoration: underline;
    }

    .reset-btn:hover { color: #1a6b1a; }
  </style>
</head>

  <div class="subtitle">RRN Fetcher</div>
</header>

<div class="card">

  <!-- Search row -->
  <div id="search-section">
    <label for="postcode-input">Postcode</label>
    <div class="input-row">
      <input type="text" id="postcode-input" placeholder="e.g. SW1A 1AA" maxlength="10" autocomplete="off" />
      <button class="search-btn" id="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- Address picker (hidden until needed) -->
  <div id="address-section" style="display:none;">
    <div class="divider"></div>
    <div class="address-list-label">Select property</div>
    <div class="address-list" id="address-list"></div>
    <button class="reset-btn" onclick="reset()">← Search again</button>
  </div>

  <!-- RRN result (hidden until selected) -->
  <div id="result-section" style="display:none;">
    <div class="divider"></div>
    <div class="result-block">
      <div class="result-address" id="result-address"></div>
      <div class="rrn-display" id="rrn-value"></div>
      <button class="copy-btn" id="copy-btn" onclick="copyRRN()">
        <span class="copy-icon">
          <span class="sq sq-back"></span>
          <span class="sq sq-front"></span>
        </span>
        Copy RRN
      </button>
      <div class="copied-msg" id="copied-msg"></div>
    </div>
    <button class="reset-btn" onclick="reset()">← Search again</button>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  // Replace this with your bearer token from get-energy-performance-data.communities.gov.uk
  const BEARER_TOKEN = '4Kv79IjTi5AZmm2yHbr0k0C6aZwMkRmj4WhkANUJRTuf3L79mVYzJyphd1hEUuZ3';
  // ────────────────────────────────────────────────────────────────────────────

  let currentRRN = '';

  document.getElementById('postcode-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  async function doSearch() {
    const raw = document.getElementById('postcode-input').value.trim();
    if (!raw) { showStatus('Please enter a postcode.', true); return; }

    const postcode = raw.toUpperCase().replace(/\s+/g, ' ');
    setLoading(true);
    hideAll();

    try {
      const encoded = encodeURIComponent(postcode);
      const url = `https://get-energy-performance-data.communities.gov.uk/api/domestic/search?postcode=${encoded}&page_size=25`;
      const headers = {
        'Authorization': `Bearer ${BEARER_TOKEN}`,
        'Accept': 'application/json'
      };

      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();
      const rows = data.data || [];

      if (rows.length === 0) {
        showStatus('No EPC certificates found for this postcode.', true);
        setLoading(false);
        return;
      }

      // Deduplicate by address — keep most recent per address
      const byAddress = {};
      for (const row of rows) {
        const addr = formatAddress(row);
        if (!byAddress[addr] || new Date(row['lodgementDate']) > new Date(byAddress[addr]['lodgementDate'])) {
          byAddress[addr] = row;
        }
      }

      const unique = Object.values(byAddress);

      if (unique.length === 1) {
        showResult(unique[0]);
      } else {
        showPicker(unique);
      }

    } catch (err) {
      showStatus('Could not fetch data. Check your bearer token or connection.', true);
      console.error(err);
    }

    setLoading(false);
  }

  function formatAddress(row) {
    const parts = [
      row['addressLine1'], row['addressLine2'], row['addressLine3'],
      row['addressLine4'], row['postcode']
    ].filter(Boolean);
    return parts.join(', ');
  }

  function showPicker(rows) {
    const list = document.getElementById('address-list');
    list.innerHTML = '';
    rows.forEach(row => {
      const addr = formatAddress(row);
      const date = row['lodgementDate'] ? formatDate(row['lodgementDate']) : '';
      const item = document.createElement('div');
      item.className = 'address-item';
      item.innerHTML = `<span class="addr-text">${addr}</span><span class="addr-date">${date}</span>`;
      item.onclick = () => showResult(row);
      list.appendChild(item);
    });
    document.getElementById('address-section').style.display = 'block';
    clearStatus();
  }

  function showResult(row) {
    hideAll();
    const rrn = row['certificateNumber'] || '';
    const addr = formatAddress(row);
    currentRRN = rrn;

    document.getElementById('result-address').textContent = addr;
    document.getElementById('rrn-value').textContent = rrn;
    document.getElementById('result-section').style.display = 'block';
    document.getElementById('copied-msg').textContent = '';
    document.getElementById('copy-btn').classList.remove('copied');
    document.getElementById('copy-btn').textContent = '';

    // Rebuild button content (copy icon + text)
    const btn = document.getElementById('copy-btn');
    btn.innerHTML = `
      <span class="copy-icon">
        <span class="sq sq-back"></span>
        <span class="sq sq-front"></span>
      </span>
      Copy RRN
    `;
    btn.onclick = copyRRN;
  }

  async function copyRRN() {
    if (!currentRRN) return;
    try {
      await navigator.clipboard.writeText(currentRRN);
    } catch {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = currentRRN;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.innerHTML = `
      <span class="copy-icon">
        <span class="sq sq-back"></span>
        <span class="sq sq-front"></span>
      </span>
      Copied!
    `;
    const msg = document.getElementById('copied-msg');
    msg.textContent = 'RRN copied to clipboard';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `
        <span class="copy-icon">
          <span class="sq sq-back"></span>
          <span class="sq sq-front"></span>
        </span>
        Copy RRN
      `;
      msg.textContent = '';
    }, 2500);
  }

  function reset() {
    hideAll();
    clearStatus();
    document.getElementById('postcode-input').value = '';
    document.getElementById('postcode-input').focus();
    currentRRN = '';
  }

  function hideAll() {
    document.getElementById('address-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
  }

  function setLoading(on) {
    const btn = document.getElementById('search-btn');
    btn.disabled = on;
    btn.textContent = on ? 'Searching…' : 'Search';
    if (on) showStatus('<span class="spinner"></span> Looking up postcode…');
  }

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status' + (isError ? ' error' : '');
  }

  function clearStatus() {
    const el = document.getElementById('status');
    el.innerHTML = '';
    el.className = 'status';
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
</script>

</body>
